services:
  api:
    image: ${API_IMAGE:-ghcr.io/mittalankur088/paliapropertybk:latest}
    restart: unless-stopped
    env_file:
      - ./backend.env
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - property_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    image: ${WEB_IMAGE:-ghcr.io/mittalankur088/paliaproperty:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  property_uploads: